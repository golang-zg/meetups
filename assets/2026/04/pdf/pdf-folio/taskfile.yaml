version: '3'

env:

vars:
  PROJECT_CODE: pdf

  # folders
  BIN_FOLDER: bin

  # build options
  # -v  print the names of packages as they are compiled
  # -s  omit the symbol table and debug information
  # -w  omit the DWARF symbol table
  #
  BUILD_OPTIONS: -v -ldflags="-s -w"

tasks:
  default:
    cmds:
      - task: list-tools
    silent: false

  build-windows:
    env:
      GOOS: windows
      GOARCH: amd64
    vars:
      OUTPUT_FILE: "{{.BIN_FOLDER}}/{{.PROJECT_CODE}}.exe"
    cmds:
      - go build {{.BUILD_OPTIONS}} {{.TASK_OPTIONS}} -o {{.OUTPUT_FILE}}
      - go version -m {{.OUTPUT_FILE}}
    internal: false

  build:
    cmds:
      - task: build-windows
        vars: { TASK_OPTIONS: "" }
    silent: false

  rebuild:
    cmds:
      - task: tidy
      - task: verify
      - task: build-windows
        vars: { TASK_OPTIONS: "-a" }
    silent: false

  tidy:
    cmds:
      - go mod tidy -v
      - go fmt ./...
    silent: false

  verify:
    cmds:
      - go mod verify
      - go vet ./...
    silent: false

  update:
    cmds:
      - go get -u all
    silent: false

  list:
    cmds:
      - go list -u -m all
    silent: false

  list-tools:
    cmds:
      - task --version
      - go version
      - gcc --version
    silent: false
  
  run:
    platforms: [windows/amd64]
    cmds:
      - .\\bin\\{{.PROJECT_CODE}}.exe {{.CLI_ARGS}}
    silent: false

  run-all:
    cmds:
      - for: [1,2,3,4,5,6]
        task: run
        vars:
          CLI_ARGS: --test'{{.ITEM}}'